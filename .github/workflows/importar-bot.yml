name: Importar pacote do bot

on:
  push:
    paths:
      - '.github/workflows/importar-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o pacote publicado
        run: |
          curl -fsSL -o /tmp/bot.zip "https://litter.catbox.moe/palabe.zip"
          rm -rf /tmp/bot && mkdir -p /tmp/bot
          unzip -q /tmp/bot.zip -d /tmp/bot
          ls -la /tmp/bot | head -20

      - name: Substituir o conteudo do repositorio
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            /tmp/bot/ ./
          echo '--- arquivos no repositorio ---'
          git status --short | head -40

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nada mudou.'
          else
            git commit -m 'chore: aplica o pacote novo do bot (tickets com categoria propria)'
            git push
          fi
